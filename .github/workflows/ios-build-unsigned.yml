# Build iOS NON SIGNÉ — validation de compilation (aucun secret, aucun envoi Apple).
#
# But : prouver que le projet Capacitor iOS génère et COMPILE (pods + xcodebuild),
# sans certificat ni provisioning. C'est l'étape 1 recommandée avant toute signature.
#
# ⚠️ Déclenchement MANUEL uniquement (workflow_dispatch). Ce workflow N'EST PAS
#    lancé automatiquement sur push : les minutes macOS GitHub sont FACTURÉES sur un
#    dépôt privé. Lancez-le vous-même depuis l'onglet « Actions » quand vous le
#    décidez.
name: iOS Build (unsigned validation)

on:
  workflow_dispatch:
  # Déclencheur limité à CETTE branche de dev uniquement (jamais main, jamais la
  # prod) : permet d'exécuter la validation sans que le workflow soit sur la branche
  # par défaut (limite plateforme de workflow_dispatch). À retirer une fois la
  # compilation validée pour ne pas consommer de minutes macOS à chaque push.
  push:
    branches:
      - claude/iwasp-audit-restructure-uzfv2l

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Capacitor 8 CLI exige Node >= 22.
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build web assets (dist/)
        run: npm run build

      - name: Generate native iOS project
        run: |
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios

      # Capacitor 8 utilise Swift Package Manager par défaut (Package.swift),
      # pas CocoaPods → aucun `pod install`. On installe les Pods uniquement si un
      # Podfile existe (compat anciens projets), sinon on s'appuie sur SPM.
      - name: Install CocoaPods (only if a Podfile exists)
        working-directory: ios/App
        run: |
          if [ -f Podfile ]; then
            pod install --repo-update
          else
            echo "Pas de Podfile (projet SPM Capacitor 8) — étape ignorée."
          fi

      - name: Compile (Release, code signing disabled)
        working-directory: ios/App
        run: |
          if [ -f App.xcworkspace/contents.xcworkspacedata ]; then
            CONTAINER=(-workspace App.xcworkspace)
          else
            CONTAINER=(-project App.xcodeproj)
          fi
          echo "Building with: ${CONTAINER[*]}"
          xcodebuild "${CONTAINER[@]}" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Summary
        if: success()
        run: |
          echo "✅ Le projet iOS compile (non signe). Etape suivante = build signe + TestFlight (workflow separe, apres ajout des secrets)."
