# Build iOS NON SIGNÉ — validation de compilation (aucun secret, aucun envoi Apple).
#
# But : prouver que le projet Capacitor iOS génère et COMPILE (pods + xcodebuild),
# sans certificat ni provisioning. C'est l'étape 1 recommandée avant toute signature.
#
# ⚠️ Déclenchement MANUEL uniquement (workflow_dispatch). Ce workflow N'EST PAS
#    lancé automatiquement sur push : les minutes macOS GitHub sont FACTURÉES sur un
#    dépôt privé. Lancez-le vous-même depuis l'onglet « Actions » quand vous le
#    décidez.
name: iOS Build (unsigned validation)

on:
  workflow_dispatch:
  # Déclencheur push TEMPORAIRE (branche de dev uniquement) réactivé pour valider
  # la compilation des nouveaux plugins du flux OAuth mobile (@capacitor/app,
  # @capacitor/browser patché). À retirer après le prochain run vert.
  push:
    branches:
      - claude/iwasp-audit-restructure-uzfv2l

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Capacitor 8 CLI exige Node >= 22.
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build web assets (dist/)
        run: npm run build

      - name: Generate native iOS project
        run: |
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios

      # Garde anti-dérive Swift : @capacitor/ios (épinglé exact dans package.json)
      # génère un CapApp-SPM/Package.swift qui épingle capacitor-swift-pm en
      # `exact:`. On VÉRIFIE cette version exacte attendue ; toute dérive fait
      # échouer le build au lieu de récupérer silencieusement une version Swift
      # incompatible. Mettre à jour EXPECTED_SWIFT_PM en cas de bump volontaire.
      - name: Verify pinned capacitor-swift-pm version (no silent drift)
        run: |
          EXPECTED_SWIFT_PM="8.5.0"
          MANIFEST="ios/App/CapApp-SPM/Package.swift"
          echo "Manifest capacitor-swift-pm line:"
          grep -n "capacitor-swift-pm" "$MANIFEST" || true
          if ! grep -q "capacitor-swift-pm.git\", exact: \"${EXPECTED_SWIFT_PM}\"" "$MANIFEST"; then
            echo "::error::capacitor-swift-pm n'est pas épinglé à exact ${EXPECTED_SWIFT_PM} (dérive Swift détectée)."
            exit 1
          fi
          echo "OK: capacitor-swift-pm épinglé à exact ${EXPECTED_SWIFT_PM}."

      # Capacitor 8 utilise Swift Package Manager par défaut (Package.swift),
      # pas CocoaPods → aucun `pod install`. On installe les Pods uniquement si un
      # Podfile existe (compat anciens projets), sinon on s'appuie sur SPM.
      - name: Install CocoaPods (only if a Podfile exists)
        working-directory: ios/App
        run: |
          if [ -f Podfile ]; then
            pod install --repo-update
          else
            echo "Pas de Podfile (projet SPM Capacitor 8) — étape ignorée."
          fi

      - name: Compile (Release, code signing disabled)
        working-directory: ios/App
        run: |
          if [ -f App.xcworkspace/contents.xcworkspacedata ]; then
            CONTAINER=(-workspace App.xcworkspace)
          else
            CONTAINER=(-project App.xcodeproj)
          fi
          echo "Building with: ${CONTAINER[*]}"
          xcodebuild "${CONTAINER[@]}" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      # Capture reproductible : le Package.resolved généré (versions Swift
      # exactes résolues) est publié comme artefact pour comparaison entre builds.
      - name: Collect resolved Swift package versions
        if: always()
        run: |
          RESOLVED=$(find ios "$RUNNER_TEMP/DerivedData" -name "Package.resolved" 2>/dev/null | head -1)
          mkdir -p "$RUNNER_TEMP/out"
          if [ -n "$RESOLVED" ]; then
            cp "$RESOLVED" "$RUNNER_TEMP/out/Package.resolved"
            echo "Package.resolved capturé depuis: $RESOLVED"
            cat "$RUNNER_TEMP/out/Package.resolved"
          else
            echo "Aucun Package.resolved trouvé." > "$RUNNER_TEMP/out/Package.resolved"
          fi

      - name: Package the unsigned .app
        run: |
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 2 -name "App.app" -type d | head -1)
          mkdir -p "$RUNNER_TEMP/out"
          if [ -z "$APP" ]; then
            echo "::error::App.app introuvable (build échoué ?)."; exit 1
          fi
          echo "Artefact .app: $APP"
          ( cd "$(dirname "$APP")" && zip -ry "$RUNNER_TEMP/out/IWASP-unsigned-App.zip" "App.app" >/dev/null )
          ls -la "$RUNNER_TEMP/out"

      - name: Upload unsigned build artifact
        uses: actions/upload-artifact@v4
        with:
          name: iwasp-ios-unsigned-app
          path: |
            ${{ runner.temp }}/out/IWASP-unsigned-App.zip
            ${{ runner.temp }}/out/Package.resolved
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: success()
        run: |
          echo "✅ Le projet iOS compile (non signe)."
          echo "Artefact publie: iwasp-ios-unsigned-app (App.app non signe + Package.resolved)."
          echo "capacitor-swift-pm epingle exact 8.5.0 (garde anti-derive active)."
