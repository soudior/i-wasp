# Build iOS SIGNÉ → archive → (optionnel) TestFlight.
#
# 🔒 Aucune valeur secrète dans ce fichier : tout vient de « Settings → Secrets and
#    variables → Actions ». Voir IOS_CLOUD_BUILD.md pour la liste exacte et où placer
#    chaque secret.
#
# ⚠️ Déclenchement MANUEL uniquement. L'envoi vers Apple/TestFlight ne se produit
#    QUE si vous saisissez explicitement le mot de confirmation dans le champ
#    « confirm_upload » au lancement. Sinon, le workflow s'arrête après l'archive et
#    ne conserve aucun artefact (aucun envoi Apple).
name: iOS TestFlight (signed)

on:
  workflow_dispatch:
    inputs:
      confirm_upload:
        description: "Taper UPLOAD-TO-TESTFLIGHT pour envoyer à Apple. Vide = archive seulement, aucun envoi."
        required: false
        default: ""

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

env:
  # Valeur NON secrète (Team ID Apple). Surchargée par la variable de dépôt si définie.
  APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || 'Y4JV4X2DJ6' }}
  APPLE_BUNDLE_ID: app.iwasp.digital
  IWASP_IOS_APPROVED_PROJECT_ID: ${{ vars.IWASP_IOS_APPROVED_PROJECT_ID }}
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
  VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}

jobs:
  build-signed:
    # Free standard runner only; refuse execution if repository becomes private.
    if: ${{ github.event.repository.private == false }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Capacitor 8 CLI exige Node >= 22.
          node-version: 22

      - name: Verify iOS backend configuration and Auth availability
        run: node scripts/verify-ios-backend.mjs

      - name: Install JS dependencies
        run: npm ci

      - name: Build web assets (dist/)
        run: npm run build

      - name: Generate native iOS project
        run: |
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios

      - name: Generate branded i-WASP iOS icons
        run: |
          mkdir -p assets
          cp public/app-icon-1024.png assets/icon-only.png
          npx capacitor-assets generate --ios
          test -f ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json
          find ios/App/App/Assets.xcassets/AppIcon.appiconset -maxdepth 1 -type f -print

      - name: Apply entitlements (Associated Domains + Sign in with Apple)
        run: node scripts/configure-ios-native.mjs

      # Capacitor 8 = Swift Package Manager (Package.swift), pas de Podfile.
      - name: Install CocoaPods (only if a Podfile exists)
        working-directory: ios/App
        run: |
          if [ -f Podfile ]; then
            pod install --repo-update
          else
            echo "Pas de Podfile (projet SPM Capacitor 8) — étape ignorée."
          fi

      - name: Import signing certificate (.p12)
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      - name: Install App Store provisioning profile
        env:
          IOS_PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROFILE_B64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/iwasp-app-store.mobileprovision"


      - name: Validate existing App Store profile (no portal changes)
        run: |
          security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/iwasp-app-store.mobileprovision" > "$RUNNER_TEMP/iwasp-profile.plist"
          python3 - <<'PYPROFILE'
          import datetime, os, pathlib, plistlib
          with open(pathlib.Path(os.environ['RUNNER_TEMP']) / 'iwasp-profile.plist', 'rb') as f:
              profile = plistlib.load(f)
          entitlements = profile.get('Entitlements', {})
          team = os.environ['APPLE_TEAM_ID']
          bundle = os.environ['APPLE_BUNDLE_ID']
          expiry = profile.get('ExpirationDate')
          checks = [
              profile.get('Name') == 'iwasp App Store NFC',
              team in profile.get('TeamIdentifier', []),
              entitlements.get('com.apple.developer.team-identifier') == team,
              entitlements.get('application-identifier', '').endswith('.' + bundle),
              entitlements.get('get-task-allow') is False,
              'ProvisionedDevices' not in profile,
              not profile.get('ProvisionsAllDevices'),
              isinstance(expiry, datetime.datetime) and expiry.replace(tzinfo=datetime.timezone.utc) > datetime.datetime.now(datetime.timezone.utc),
          ]
          if not all(checks):
              raise SystemExit('Existing App Store profile invalid, expired or mismatched. Stop; do not recreate credentials automatically.')
          print('Existing App Store profile accepted; Xcode still validates certificate and entitlements.')
          PYPROFILE

      - name: Archive (Release, existing certificate and profile only)
        working-directory: ios/App
        run: |
          if [ -f App.xcworkspace/contents.xcworkspacedata ]; then
            CONTAINER=(-workspace App.xcworkspace)
          else
            CONTAINER=(-project App.xcodeproj)
          fi
          echo "Archiving with: ${CONTAINER[*]}"
          xcodebuild "${CONTAINER[@]}" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$APPLE_BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="iwasp App Store NFC" \
            clean archive

      - name: Write ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>app.iwasp.digital</key><string>iwasp App Store NFC</string>
            </dict>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><false/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Install App Store Connect API key (explicit TestFlight upload only)
        if: ${{ inputs.confirm_upload == 'UPLOAD-TO-TESTFLIGHT' }}
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p "$HOME/private_keys"
          echo "$ASC_KEY_B64" | base64 --decode > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Upload to TestFlight (ONLY if explicitly confirmed)
        if: ${{ inputs.confirm_upload == 'UPLOAD-TO-TESTFLIGHT' }}
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          IPA=$(ls "$RUNNER_TEMP/export/"*.ipa | head -1)
          echo "Envoi vers TestFlight : $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Note if upload was skipped
        if: ${{ inputs.confirm_upload != 'UPLOAD-TO-TESTFLIGHT' }}
        run: |
          echo "Archive signee validee, sans envoi Apple, sans artefact GitHub ni cache persistant."
          echo "Aucun IPA telechargeable conserve. Un envoi TestFlight demande un accord distinct."
