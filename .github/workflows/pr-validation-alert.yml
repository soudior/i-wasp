name: PR validation failure alert

on:
  workflow_run:
    workflows: [PR validation]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  alert:
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Aucun checkout, artefact ou code de PR : ce workflow privilégié ne lit
      # que les métadonnées GitHub. Actif après fusion sur la branche par défaut.
      - name: Comment failed steps and expected action
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner, repo: context.repo.repo,
              run_id: run.id, filter: 'latest', per_page: 100,
            });
            const failed = jobs.filter(j => ['failure', 'timed_out'].includes(j.conclusion));
            const lines = failed.map(j => {
              const steps = (j.steps || []).filter(s => ['failure', 'timed_out'].includes(s.conclusion));
              return `- **${j.name}** — ${steps.map(s => s.name).join(', ') || j.conclusion} : [logs](${j.html_url})`;
            });
            const body = ['<!-- iwasp-pr-validation-failure -->',
              `## CI en échec — tentative ${run.run_attempt}`,
              ...lines, `[Exécution complète](${run.html_url})`,
              '**Action attendue :** ouvrir l’étape rouge, reproduire la commande indiquée dans CI_VALIDATION.md, corriger sur la branche et pousser. Ne pas fusionner tant que les six contrôles ne sont pas verts.',
              'Le contrôle iOS Linux ne remplace ni une compilation Xcode ni une validation sur iPad réel.',
            ].join('\n\n');
            await core.summary.addRaw(body).write();
            for (const pr of run.pull_requests || []) {
              const { data: current } = await github.rest.pulls.get({
                ...context.repo, pull_number: pr.number,
              });
              // Ne pas notifier une ancienne révision devenue obsolète.
              if (current.state !== 'open' || current.head.sha !== run.head_sha) continue;
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo, issue_number: pr.number, per_page: 100,
              });
              const previous = comments.find(c => c.user.type === 'Bot' &&
                c.body?.includes('<!-- iwasp-pr-validation-failure -->'));
              if (previous) {
                await github.rest.issues.updateComment({ ...context.repo,
                  comment_id: previous.id, body });
              } else {
                await github.rest.issues.createComment({ ...context.repo,
                  issue_number: pr.number, body });
              }
            }
